name: Suite tests

on:
  push:
    branches: [main, codex/import-suite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install suite and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Planner and suite tests
        run: python -m pytest -q test_core.py test_suite.py
      - name: Logger tests
        run: python -m unittest discover -s logger/tests
